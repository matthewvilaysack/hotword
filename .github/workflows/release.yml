# Tag-driven, in the Linux and Cilium shape: an annotated tag named vX.Y.Z on
# main is the release event. Nothing is published unless the same commit is
# green, the tag matches Cargo.toml, and CHANGELOG.md has a section for it.
# Both macOS targets build on the Apple silicon runner; the Intel one is a
# cross-compile, since GitHub retired the macos-13 pool.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$cargo_version" ]; then
            echo "tag v$tag does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi
          if ! grep -q "^## $tag\$" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $tag" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag is not on main" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: make format-check
      - run: make lint
      - run: make test

  build:
    needs: gate
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: |
          name="hotword-${{ needs.gate.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/hotword" README.md LICENSE CHANGELOG.md "$name/"
          cp -r examples "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: hotword-*.tar.gz
          if-no-files-found: error

  publish:
    needs: [gate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write release notes
        run: |
          version="${{ needs.gate.outputs.version }}"
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            awk -v v="$version" '$0 == "## " v {p=1; next} /^## / {p=0} p' CHANGELOG.md
            echo
            echo "## Commits"
            echo
            if [ -n "$previous" ]; then
              git shortlog --no-merges --format='%h %s' "$previous..${GITHUB_REF_NAME}"
            else
              git shortlog --no-merges --format='%h %s' "${GITHUB_REF_NAME}"
            fi
            echo
            echo "## Checksums"
            echo
            echo '```'
            (cd dist && sha256sum *.tar.gz | tee SHA256SUMS)
            echo '```'
          } > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-rc*|*-alpha*|*-beta*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" $prerelease \
            --verify-tag \
            --title "hotword ${{ needs.gate.outputs.version }}" \
            --notes-file notes.md \
            dist/*.tar.gz dist/SHA256SUMS
