# Copy to ~/.config/hotword/ (or a repo's .hotword/) and adjust the paths.
# Steps whose binary or directory is missing are skipped, so this is safe to
# share with a teammate who has only some of the tools installed.
name = "deploy-status"
description = "Where the checkout, CI, and open pull requests stand right now"
triggers = ["check the deploy", "deploy status"]
timeout = 20

[[steps]]
name = "branch"
run = "git status --short --branch | head -20"

[[steps]]
name = "unpushed"
run = "git log --branches --not --remotes --oneline | head -20"

[[steps]]
name = "worktrees"
run = "git worktree list"

[[steps]]
name = "ci"
run = "gh run list --limit 5"
requires = ["gh"]
timeout = 20

[[steps]]
name = "open-prs"
run = "gh pr list --state open --limit 10"
requires = ["gh"]
timeout = 20

[[steps]]
name = "release"
run = "gh release view --json tagName,publishedAt --jq '\"\\(.tagName) published \\(.publishedAt[:10])\"'"
requires = ["gh"]
