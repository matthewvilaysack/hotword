[package]
name = "hotword"
version = "0.1.0"
edition = "2021"
description = "Phrase-triggered and session-start workflows for terminal coding agents"
license = "MIT"
repository = "https://github.com/matthewvilaysack/hotword"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
inquire = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
