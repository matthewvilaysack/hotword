# Measure a page against the sites you admire before the agent answers.
#
# Say "critique my page http://localhost:3000 vs stripe.com,linear.app",
# "yardstick https://acme.com against @fintech", or just "does this look generic"
# with a URL in the prompt. Steps read the URL and the references out of
# HOTWORD_PROMPT; with no references named they use your first saved theme.
# Numbers come from each page's DOM, standards from the references, no model.
name = "yardstick"
description = "Measured design critique of a page against named reference sites, with the key moves and a recommended direction"
triggers = ["yardstick", "critique my page", "critique this page", "measure my page", "does this look generic", "compare my page"]
timeout = 30
max_lines = 220

[[steps]]
name = "references"
run = "yardstick list"

[[steps]]
name = "themes"
run = "yardstick themes"

[[steps]]
name = "critique"
timeout = 110
run = """
url=$(printf '%s' "$HOTWORD_PROMPT" | grep -oE 'https?://[^ ]+|localhost:[0-9]+[^ ]*' | head -1)
[ -z "$url" ] && { echo "no page URL in the prompt; say the URL to measure"; exit 0; }
vs=$(printf '%s' "$HOTWORD_PROMPT" | grep -oiE '(vs|against) +[^ ]+' | head -1 | awk '{print $2}')
[ -z "$vs" ] && vs=$(printf '%s' "$HOTWORD_PROMPT" | grep -oE '@[a-z0-9-]+' | head -1)
[ -z "$vs" ] && vs=$(yardstick themes --json | python3 -c 'import json,sys; t=json.load(sys.stdin).get("themes"); print("@"+t[0]["name"] if isinstance(t,list) and t else "")')
[ -z "$vs" ] && { echo "no references named and no theme saved; say 'vs a.com,b.com' or create a theme"; exit 0; }
yardstick critique "$url" --vs "$vs"
"""
